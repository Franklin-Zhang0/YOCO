dataset:
  path: "/home/franklin/data/hand_teleop/left_glove_to_inspire_0718_merged/"
  input_keys: "glove.left.tensile_data"
  output_keys: "robot.left.target_angles"
  augmentations:
    input: 
      dropout:
        p: 0.2
      gaussian_noise:
        sigma: 0.0001
    hypernet_input:
      dropout:
        p: 0.3

model:
  type: "MLP"
  hidden_layers: [256, 256, 256, 256]

trainer:
  expname: "MLP_0721"
  num_epochs: 30
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 1e-3
  grad_clipping: 1.0
  calibnet_warmup_epochs: 20
  val_split: 0.1
  device: 'cpu'
  calib_finetune: False
  save_path: "/home/franklin/expdata/teleop_models/pretrained"

