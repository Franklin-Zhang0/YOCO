dataset:
  input_keys: "world_hand_joints"
  output_keys: "denormed_robot_joint_pose"

model:
  type: "MLP"

trainer:
  expname: "GRPO_finetune"
  num_epochs: 100
  batch_size: 16
  learning_rate: 0.001
  grad_clipping: 1.0
  device: 'cuda'
  save_path: "expdata/grpo_models"
  
  # GRPO specific
  group_size: 128
  eps_clip: 0.2
  std: 0.05
  mano_kl_coeff: 1e-6
  scale_kl_coeff: 1e-5
  std_decay: 0.995
  loss_type: "dex_retarget_mse"
  mano_comp: 5

  # LoRA configuration (optional - set enabled: true to use)
  lora:
    enabled: false  # Set to true to enable LoRA fine-tuning
    rank: 8  # LoRA rank (lower = fewer parameters)
    alpha: 8.0  # LoRA scaling factor
    dropout: 0.1  # LoRA dropout
    target_modules: []  # Empty = apply LoRA to all Linear layers
    train_finger_scaling: true  # Also train finger_scaling parameter

  logger:
    project: adaptive_retarget_rl

rewarder_config:
  retarget_workers: 32
