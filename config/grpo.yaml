dataset:
  input_keys: "world_hand_joints"
  output_keys: "denormed_robot_joint_pose"

model:
  type: "MLP"

trainer:
  expname: "GRPO_finetune"
  num_epochs: 10
  batch_size: 16
  learning_rate: 0.001
  grad_clipping: 1.0
  device: 'cuda'
  save_path: "expdata/grpo_models"
  
  # GRPO specific
  group_size: 32
  eps_clip: 0.2
  std: 0.02
  mano_kl_coeff: 0.0
  scale_kl_coeff: 1e-5
  std_decay: 0.995
  loss_type: "dex_retarget_mse"
  mano_comp: 5
